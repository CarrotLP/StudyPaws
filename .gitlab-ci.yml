stages:
  - test
  - build
  - update

variables:
  NODE_VERSION: "20"

# Shared Node setup
.node_setup: &node_setup
  image: node:20
  tags:
    - edtech
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
  before_script:
    - npm ci --legacy-peer-deps --cache .npm --prefer-offline

# CI: type-check on every push and MR
typecheck:
  <<: *node_setup
  stage: test
  script:
    - npx tsc --noEmit
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "dev"'

# Manual Android build via EAS
build:android:
  <<: *node_setup
  stage: build
  script:
    - npm install -g eas-cli
    - eas build --platform android --profile preview --non-interactive --no-wait
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual

# Manual iOS build via EAS
build:ios:
  <<: *node_setup
  stage: build
  script:
    - npm install -g eas-cli
    - eas build --platform ios --profile preview --non-interactive --no-wait
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual

# Build both with one click
build:all:
  <<: *node_setup
  stage: build
  script:
    - npm install -g eas-cli
    - eas workflow:run create-production-builds.yml --non-interactive
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual

# OTA update on main
eas-update:
  <<: *node_setup
  stage: update
  script:
    - npm install -g eas-cli
    - eas update --branch production --message "$CI_COMMIT_MESSAGE" --non-interactive
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - "src/**/*"
        - "app.json"
        - "package.json"