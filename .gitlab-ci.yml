stages:
  - test
  - build
  - update

variables:
  NODE_VERSION: "20"

# Shared Node setup
.node_setup: &node_setup
  image: node:20
  tags:
    - edtech
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
  before_script:
    - npm ci --legacy-peer-deps --cache .npm --prefer-offline

# CI: type-check on every push and MR
typecheck:
  <<: *node_setup
  stage: test
  script:
    - npx tsc --noEmit
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "dev"'

# Manual Android build via EAS
build:android:
  <<: *node_setup
  stage: build
  script:
    - npm install -g eas-cli
    - eas build --platform android --profile preview --non-interactive --no-wait
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual

# Manual iOS build via EAS
build:ios:
  <<: *node_setup
  stage: build
  script:
    - npm install -g eas-cli
    - eas build --platform ios --profile preview --non-interactive --no-wait
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual

# Build both platforms with one click (direct EAS builds — no EAS Workflows)
build:all:
  <<: *node_setup
  stage: build
  script:
    - npm install -g eas-cli
    - eas build --platform android --profile preview --non-interactive --no-wait
    - eas build --platform ios --profile preview --non-interactive --no-wait
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual

# OTA update on master — publishes a JS/asset bundle to the "preview" channel,
# which the distributed APK listens on. Installed APKs download it on cold start
# and apply it on the NEXT launch (default expo-updates behaviour).
#
# runtimeVersion is pinned to "1" in app.json. Increment it ONLY when adding a
# native module or changing native config; bumping the app version does NOT
# require changing runtimeVersion. OTA can only reach builds with a MATCHING
# runtimeVersion, so the safety check below blocks updates that change the
# native/runtime surface — those require a fresh APK, not an OTA.
eas-update:
  <<: *node_setup
  stage: update
  variables:
    GIT_DEPTH: 0   # full clone, the safety check needs history
  script:
    # 1. Require EXPO_TOKEN (the EAS CLI reads it automatically for auth).
    - |
      if [ -z "$EXPO_TOKEN" ]; then
        echo "ERROR: EXPO_TOKEN is not set."
        echo "Create one at https://expo.dev -> Account settings -> Access Tokens."
        echo "Then add it in GitLab: Project -> Settings -> CI/CD -> Variables"
        echo "  Key: EXPO_TOKEN   Masked: yes   Protected: yes"
        echo "See SETUP.md for the full walkthrough."
        exit 1
      fi
    # 2. Block OTA when this commit changes runtimeVersion (app.json) or the
    #    major/minor of the package.json version — those need a new APK.
    - |
      # Resolve the previous commit robustly:
      #   1) CI_COMMIT_BEFORE_SHA if set, not the all-zeros sha, and present;
      #   2) else the parent of the current commit (HEAD~1);
      #   3) else bail out of the guard (warn + proceed) — never permablock.
      PREV=""
      if [ -n "$CI_COMMIT_BEFORE_SHA" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${CI_COMMIT_BEFORE_SHA}^{commit}" 2>/dev/null; then
        PREV="$CI_COMMIT_BEFORE_SHA"
      elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
        PREV="$(git rev-parse HEAD~1)"
      fi
      if [ -z "$PREV" ]; then
        echo "WARNING: could not resolve a previous commit (repo too shallow?). Skipping native-change guard and proceeding with OTA."
      else
        echo "Comparing against previous commit: $PREV"
        git show "$PREV:app.json" > /tmp/old-app.json 2>/dev/null || echo '{}' > /tmp/old-app.json
        git show "$PREV:package.json" > /tmp/old-pkg.json 2>/dev/null || echo '{}' > /tmp/old-pkg.json
        RT_OLD=$(node -e "try{console.log(JSON.stringify(require('/tmp/old-app.json').expo.runtimeVersion))}catch(e){console.log('null')}")
        RT_NEW=$(node -e "console.log(JSON.stringify(require('./app.json').expo.runtimeVersion))")
        VER_OLD=$(node -e "try{console.log((require('/tmp/old-pkg.json').version||'0.0.0').split('.').slice(0,2).join('.'))}catch(e){console.log('0.0')}")
        VER_NEW=$(node -e "console.log((require('./package.json').version||'0.0.0').split('.').slice(0,2).join('.'))")
        if [ "$RT_OLD" != "$RT_NEW" ] || [ "$VER_OLD" != "$VER_NEW" ]; then
          echo "Native or runtime change detected — OTA cannot apply this safely. Build a new APK instead."
          echo "  runtimeVersion: ${RT_OLD} -> ${RT_NEW}"
          echo "  package.json version (major.minor): ${VER_OLD} -> ${VER_NEW}"
          exit 1
        fi
      fi
    # 3. Publish the OTA update to the "preview" channel.
    - npm install -g eas-cli
    - eas update --branch preview --message "$CI_COMMIT_TITLE" --non-interactive
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - "app/**/*"
        - "src/**/*"
        - "assets/**/*"
        - "app.json"
        - "package.json"
        - "package-lock.json"